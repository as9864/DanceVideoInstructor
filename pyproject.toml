[project]
name = "dvi"
version = "0.1.0"
description = "DanceVideoInstructor — tango video analysis for posture/axis/couple metrics"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.13",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "av>=18.1.0",
    "opencv-python-headless>=5.0.0.93",
]

[project.scripts]
dvi = "dvi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dvi"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
