# Coaching comment templates (ARCHITECTURE.md §7.3). Numbers/rules are the source of truth;
# templates only phrase them. {value} / {target} are substituted from the Finding's measurement.
templates:
  POS-01:
    major: "상체가 목표 범위를 크게 벗어나 기울어 있습니다 (평균 {value:.1f}°, 목표 {target}). 골반 위에 상체를 다시 정렬해 보세요."
    minor: "상체 전후 기울기가 목표보다 약간 큽니다 (평균 {value:.1f}°, 목표 {target})."
  POS-03:
    major: "허리에서 상체가 꺾이고 있습니다 (평균 {value:.1f}°, 목표 {target} 이하). 명치를 들고 골반부터 머리까지 한 선으로 유지하세요."
    minor: "척추 정렬이 약간 흐트러지고 있습니다 (평균 {value:.1f}°)."
  AXI-01:
    major: "무게중심이 지지발에서 많이 벗어났습니다 (평균 오프셋 {value:.2f}, 목표 {target} 이하). 체중이 실린 발 위에 완전히 서보세요."
    minor: "무게중심이 지지발에서 약간 벗어나 있습니다 (평균 오프셋 {value:.2f})."
  AXI-02:
    major: "정지 구간에서 축이 심하게 흔들립니다 (표준편차 {value:.2f}). 지지 다리 무릎과 발목의 미세 조정을 줄여보세요."
  CPL-01:
    major: "두 사람 사이 거리가 불안정합니다 (변동계수 {value:.2f}, 목표 {target} 이하)."
