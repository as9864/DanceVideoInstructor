# Style profile: milonguero / apilado (ARCHITECTURE.md §6.6, §5 domain glossary warning).
# Forward torso lean is EXPECTED here — only POS-01 differs from salon.yaml; all other
# targets are placeholders inherited from salon until V4/V5 calibration (PROJECT.md §7).
style: milonguero
targets:
  POS-01: { min: 5.0, max: 12.0, unit: deg, tolerance: 2.0 }
  POS-02: { max: 3.0, unit: deg }
  POS-03: { max: 8.0, unit: deg }
  POS-04: { max: 0.12, unit: normalized }
  POS-05a: { max: 0.10, unit: normalized }
  POS-05b: { max: 3.0, unit: deg }
  POS-06: { max: 0.05, unit: normalized }
  AXI-01: { max: 0.05, unit: normalized }
  AXI-02: { max: 0.02, unit: normalized }
  AXI-04: { min: 165.0, max: 178.0, unit: deg }
  AXI-06: { max: 4.0, unit: deg }
  CPL-01: { max: 0.15, unit: coefficient_of_variation }
  CPL-03: { min: 0.0, max: 10.0, unit: deg }
  CPL-04: { max: 0.12, unit: seconds }
weights:
  posture: 0.35
  axis: 0.35
  dissociation: 0.10
  couple: 0.20
